name: Deploy binary
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo dev-$(git rev-parse --short HEAD))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend (static linux/amd64)
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" \
            -o new-api
          gzip -9 -c new-api > new-api.gz
      - name: Upload over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "mkdir -p /opt/new-api && cp -a /opt/new-api/new-api /opt/new-api/new-api.prev 2>/dev/null || true"
          scp -i key new-api.gz "$USER@$HOST:/opt/new-api/new-api.next.gz"
      - name: Switch binary and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$KEY" > key
          ssh -i key "$USER@$HOST" "\
            gunzip -c /opt/new-api/new-api.next.gz > /opt/new-api/new-api.next && \
            install -m 755 /opt/new-api/new-api.next /opt/new-api/new-api && \
            rm -f /opt/new-api/new-api.next.gz && \
            sudo systemctl restart new-api"
          sleep 3
          ssh -i key "$USER@$HOST" "curl -fsS http://127.0.0.1:3000/api/status >/dev/null && echo healthy"
